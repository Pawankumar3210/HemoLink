{% extends "base.html" %}
{% block content %}
<section class="container-narrow error-page">
  <p class="error-code">{% block code %}{% endblock %}</p>
  <h1>{% block heading %}{% endblock %}</h1>
  <p class="lead">{% block message %}{% endblock %}</p>
  <div class="cluster">
    <a class="btn btn-primary" href="{{ url_for('main.index') }}">Go to the home page</a>
    {% if current_user.is_authenticated %}<a class="btn btn-secondary" href="{{ url_for('dashboard.home') }}">Open my dashboard</a>{% endif %}
  </div>
</section>
{% endblock %}
