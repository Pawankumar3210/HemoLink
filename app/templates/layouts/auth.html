{% extends "base.html" %}
{% from "partials/_macros.html" import logo, icon %}
{% block body_class %}is-auth{% endblock %}
{% block shell %}
<main id="main" class="auth-page">
  <div class="auth-card reveal is-visible">
    <a class="auth-back" href="{{ request.referrer if request.referrer and request.host in request.referrer else url_for('main.index') }}">{{ icon('arrow-left', 16) }} Back</a>
    <div class="auth-card-head">
      <a class="auth-brand" href="{{ url_for('main.index') }}" aria-label="HemoLink home">{{ logo(36) }}</a>
    </div>
    {% include "partials/_flash.html" %}
    {% block auth_content %}{% endblock %}
  </div>
  <p class="auth-foot"><a href="{{ url_for('main.privacy') }}">Privacy</a> <a href="{{ url_for('main.terms') }}">Terms</a></p>
</main>
{% endblock %}
