name: Deploy

# Runs only after the CI workflow has finished successfully on main (or when started
# by hand on main). A failed lint, test or Docker check therefore blocks deployment.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once, and never cancel one half-way.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  gate:
    name: Check that deployment is allowed
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Require a green CI run on main
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "Manual deployments are only allowed from main."; exit 1
            fi
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ] \
               || [ "${{ github.event.workflow_run.event }}" != "push" ]; then
              echo "CI did not succeed for a push to main. Not deploying."; exit 1
            fi
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

  migrate:
    name: Apply database migrations
    needs: gate
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment to approve migrations by hand.
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Show the migration that will run
        env:
          APP_ENV: development
          FLASK_DEBUG: "0"
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DB_SSL_CA: ${{ vars.DB_SSL_CA }}
        run: flask --app run db current
      - name: Upgrade the production schema
        env:
          APP_ENV: development
          FLASK_DEBUG: "0"
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DB_SSL_CA: ${{ vars.DB_SSL_CA }}
        run: flask --app run db upgrade

  deploy:
    name: Trigger Render deploy
    needs: [gate, migrate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Call the deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL is not set"; exit 1; fi
          # --silent hides the URL (which contains a secret key) from the logs.
          curl --fail --silent --show-error --max-time 60 -X POST "$HOOK" > /dev/null
          echo "Deploy requested for ${{ needs.gate.outputs.sha }}"

  verify:
    name: Verify the live site
    needs: [gate, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Smoke test production
        env:
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$URL" ]; then echo "Set the PRODUCTION_URL repository variable"; exit 1; fi
          # Docker builds on Render can take several minutes: allow up to 20 minutes.
          SMOKE_ATTEMPTS=80 SMOKE_DELAY=15 sh scripts/smoke_test.sh "$URL" "${{ needs.gate.outputs.sha }}"
