[project]
name = "hemolink"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<3.2",
  "Flask-SQLAlchemy>=3.1,<3.2",
  "SQLAlchemy>=2.0,<2.1",
  "Flask-Migrate>=4.0,<5",
  "Flask-Login>=0.6.3,<0.7",
  "Flask-WTF>=1.2,<1.3",
  "PyMySQL>=1.1,<2",
  "cryptography>=42,<51",
  "gunicorn>=22,<24",
  "python-dotenv>=1.0,<2",
]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    migrations
  | instance
)/
'''
